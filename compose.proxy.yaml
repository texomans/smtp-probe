# Optional HTTPS deployment behind any trusted container reverse proxy.
# Requires an existing Docker network and an HTTPS origin; publishes no host ports.
name: smtp-probe
services:
  app:
    image: ${SMTP_PROBE_IMAGE:-ghcr.io/texomans/smtp-probe:v0.2.0-beta.1}
    container_name: smtp-probe
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 1.0
    environment:
      NODE_ENV: production
      PORT: '3000'
      SMTP_PROBE_PASSWORD: ${SMTP_PROBE_PASSWORD:-}
      SMTP_PROBE_PASSWORD_MIN_LENGTH: ${SMTP_PROBE_PASSWORD_MIN_LENGTH:-15}
      SMTP_PROBE_COOKIE_SECURE: '1'
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set your HTTPS origin, e.g. https://smtp.example.com}
      TRUST_PROXY: '1'
      ALLOW_SEND: ${ALLOW_SEND:-0}
      SMTP_ALLOWED_HOSTS: ${SMTP_ALLOWED_HOSTS:-}
      SMTP_SEND_ALLOWED_HOSTS: ${SMTP_SEND_ALLOWED_HOSTS:-}
      SMTP_SEND_ALLOWED_RECIPIENTS: ${SMTP_SEND_ALLOWED_RECIPIENTS:-}
      SMTP_ALLOWED_PORTS: '25,465,587,2525,8465,443'
    networks:
      - proxy
networks:
  proxy:
    external: true
    name: ${SMTP_PROBE_PROXY_NETWORK:?Specify an existing Docker proxy network}
