name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Source syntax
        run: npm run check
      - name: SMTP protocol and security tests
        run: npm test
      - name: Build container image
        run: docker build --pull -t smtp-probe:ci .
